name: Playwright Intent

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write # the agent commits changed steps to the pull request
  actions: write # approves the checks on the agent's commit
  id-token: write # used by the Vercel deployment action

jobs:
  intent:
    name: Playwright Intent
    if: github.repository == 'endformdev/webinar-playwright-example'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: webinar-playwright-example
          set-url-env-var: BASE_URL
          deployment-protection-bypass: false

      - name: Run intent tests
        run: pnpm exec playwright test -c playwright.intent.config.ts
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A commit made with GITHUB_TOKEN waits for approval before its
      # workflows run, so approve the checks on the agent's commit here.
      - name: Run checks on the updated steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$head" = "$TESTED_SHA" ]; then
            echo "No step changes were committed"
            exit 0
          fi
          for attempt in $(seq 1 24); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&status=action_required" --jq '.workflow_runs[].id')
            [ "$(echo "$runs" | grep -c .)" -ge 3 ] && break
            sleep 5
          done
          for run in $runs; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" && echo "Approved run $run"
          done
